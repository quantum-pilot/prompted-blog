<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth Authentication</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      margin: 0 auto 1rem;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .success {
      color: #10b981;
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .error {
      color: #ef4444;
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      color: #1f2937;
    }

    p {
      margin: 0;
      color: #6b7280;
      line-height: 1.5;
    }

    .error-details {
      margin-top: 1rem;
      padding: 1rem;
      background: #fef2f2;
      border: 1px solid #fee2e2;
      border-radius: 4px;
      color: #991b1b;
      font-size: 0.875rem;
      text-align: left;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading">
      <div class="spinner"></div>
      <h1>Authenticating...</h1>
      <p>Please wait while we complete your sign-in.</p>
    </div>

    <div id="success" class="hidden">
      <div class="success">✓</div>
      <h1>Authentication Successful!</h1>
      <p>You can now close this window.</p>
    </div>

    <div id="error" class="hidden">
      <div class="error">✗</div>
      <h1>Authentication Failed</h1>
      <p>There was a problem signing you in.</p>
      <div id="error-details" class="error-details"></div>
    </div>
  </div>

  <script>
    (function() {
      // Get URL parameters
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      const errorDescription = params.get('error_description');

      // Function to show success
      function showSuccess() {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('success').classList.remove('hidden');

        // Auto-close after 2 seconds
        setTimeout(() => {
          window.close();
        }, 2000);
      }

      // Function to show error
      function showError(message) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
        document.getElementById('error-details').textContent = message;

        // Auto-close after 5 seconds
        setTimeout(() => {
          window.close();
        }, 5000);
      }

      // This page is only used for popup mode
      // Check if we're in a popup
      if (window.opener && !window.opener.closed) {
        // We're in a popup - send message to parent
        try {
          // Prepare message data
          const messageData = {};

          if (error) {
            messageData.error = error;
            messageData.error_description = errorDescription || 'Authentication failed';
            showError(messageData.error_description);
          } else if (code && state) {
            messageData.code = code;
            messageData.state = state;
            showSuccess();
          } else {
            messageData.error = 'invalid_response';
            messageData.error_description = 'Invalid OAuth response';
            showError('Invalid OAuth response - missing required parameters');
          }

          // Post message to opener
          window.opener.postMessage(messageData, window.location.origin);

        } catch (e) {
          console.error('Failed to send message to parent:', e);
          showError('Failed to communicate with parent window');
        }
      } else {
        // Not in a popup - this shouldn't happen as we only support popup mode
        showError('This page must be opened in a popup window for authentication.');
      }
    })();
  </script>
</body>
</html>
