<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';">
    <title>OAuth Callback</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #333;
      }

      .container {
        background: white;
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
          0 10px 10px -5px rgba(0, 0, 0, 0.04);
        text-align: center;
        max-width: 400px;
        width: 90%;
      }

      .spinner {
        display: inline-block;
        width: 50px;
        height: 50px;
        border: 3px solid rgba(102, 126, 234, 0.3);
        border-radius: 50%;
        border-top-color: #667eea;
        animation: spin 1s ease-in-out infinite;
        margin-bottom: 1rem;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .message {
        font-size: 1.1rem;
        line-height: 1.6;
        margin-top: 0.5rem;
      }

      .success {
        color: #10b981;
      }

      .error {
        color: #ef4444;
      }

      .info {
        color: #6b7280;
        font-size: 0.9rem;
        margin-top: 1rem;
      }

      .error-details {
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 6px;
        padding: 0.75rem;
        margin-top: 1rem;
        font-size: 0.85rem;
        color: #991b1b;
        word-break: break-word;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="loading" class="state">
        <div class="spinner"></div>
        <div class="message">Processing OAuth response...</div>
      </div>

      <div id="success" class="state hidden">
        <svg
          width="50"
          height="50"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#10b981"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          style="margin-bottom: 1rem"
        >
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <div class="message success">Processing complete!</div>
        <div class="info">
          This window will close automatically.
        </div>
      </div>

      <div id="error" class="state hidden">
        <svg
          width="50"
          height="50"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ef4444"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          style="margin-bottom: 1rem"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <div class="message error">Authentication failed</div>
        <div id="error-details" class="error-details hidden"></div>
        <div class="info">You can close this window and try again.</div>
      </div>

      <div id="no-parent" class="state hidden">
        <svg
          width="50"
          height="50"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#f59e0b"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          style="margin-bottom: 1rem"
        >
          <path
            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
          ></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <div class="message">OAuth callback received</div>
        <div class="info">
          This window was opened directly. OAuth data has been processed but
          couldn't be sent to a parent window.
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        // Parse URL parameters with validation
        function parseUrlParams() {
          const params = {};
          const ALLOWED_PARAMS = ['code', 'state', 'error', 'error_description', 'error_uri'];
          const searchParams = new URLSearchParams(window.location.search);
          for (const [key, value] of searchParams) {
            // Only accept whitelisted parameters
            if (ALLOWED_PARAMS.includes(key)) {
              params[key] = value;
            }
          }
          return params;
        }

        // Show a specific state
        function showState(stateId) {
          document.querySelectorAll(".state").forEach((state) => {
            state.classList.add("hidden");
          });
          const state = document.getElementById(stateId);
          if (state) {
            state.classList.remove("hidden");
          }
        }

        // Handle OAuth callback
        function handleOAuthCallback() {
          const params = parseUrlParams();

          // Check if we have OAuth response parameters
          const hasOAuthResponse =
            params.code || params.error || params.token || params.access_token;

          if (!hasOAuthResponse) {
            showState("error");
            const errorDetails = document.getElementById("error-details");
            errorDetails.textContent = "No OAuth parameters found in URL";
            errorDetails.classList.remove("hidden");
            return;
          }

          // Determine if this is a success or error response
          const isError =
            params.error ||
            (!params.code && !params.token && !params.access_token);

          // Prepare the message data
          // Spread params at the root level for compatibility with the popup handler
          const messageData = {
            ...params,
            type: "oauth-callback",
            timestamp: Date.now(),
          };

          // Try to send to parent window
          let messageSent = false;

          // Get the allowed origin (same origin as this page)
          const allowedOrigin = window.location.origin;
          
          // Try window.opener first (popup scenario)
          if (window.opener && window.opener !== window) {
            try {
              window.opener.postMessage(messageData, allowedOrigin);
              messageSent = true;
            } catch (e) {
              console.error("Failed to post message to opener:", e);
            }
          }

          // Try parent window (iframe scenario)
          if (!messageSent && window.parent && window.parent !== window) {
            try {
              window.parent.postMessage(messageData, allowedOrigin);
              messageSent = true;
            } catch (e) {
              console.error("Failed to post message to parent:", e);
            }
          }

          // Update UI based on result
          if (messageSent) {
            // Always show success state since message was sent
            // The main window will handle error display
            showState("success");
            
            // Always try to close the window after a short delay
            // regardless of success or error
            setTimeout(() => {
              try {
                window.close();
              } catch (e) {
                // Window might not be closeable if not opened by script
                console.log("Could not auto-close window");
              }
            }, 1500);
          } else {
            // No parent window found
            showState("no-parent");
            console.log("OAuth callback parameters:", params);
          }
        }

        // Run on page load
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", handleOAuthCallback);
        } else {
          handleOAuthCallback();
        }
      })();
    </script>
  </body>
</html>
