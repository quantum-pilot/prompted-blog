<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prompted Blog</title>
  <link rel="stylesheet" href="assets/github-markdown.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 2rem auto;
      max-width: 800px;
      padding: 0 1rem;
      position: relative;
    }
    .header {
      border-bottom: 1px solid #e1e4e8;
      margin-bottom: 2rem;
      position: relative;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0;
    }
    .description {
      color: #586069;
      font-size: 1.1rem;
      margin: 0.5rem 0 1.5rem;
    }
    .history-button {
      position: absolute;
      right: -5rem;
      top: 0.5rem;
      transform: rotate(-90deg);
      transform-origin: right top;
      background: #f6f8fa;
      border: 1px solid #d1d5da;
      padding: 0.3rem 0.6rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .nav-button {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: #f6f8fa;
      border: 1px solid #d1d5da;
      padding: 0.3rem 0.6rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .prev-post {
      left: 0.5rem;
    }
    .next-post {
      right: 0.5rem;
    }
  </style>
</head>
<body>
  <button class="nav-button prev-post">← Prev</button>
  <button class="nav-button next-post">Next →</button>
  <header class="header">
    <h1>Prompted Blog</h1>
    <p class="description">Prompt-driven commit history as a blog. One prompt at a time.</p>
    <button class="history-button" onclick="location.search='?history_enabled=true'">Prompt History</button>
  </header>
  <main id="latest-post" class="markdown-body">
    <!-- Latest post will be injected here -->
  </main>
  <script>
    fetch('latest.json')
      .then(res => res.json())
      .then(obj => fetch(`${obj.relpath}/index.html`))
      .then(res => res.text())
      .then(html => {
        const temp = document.createElement('div');
        temp.innerHTML = html;
        const post = temp.querySelector('.markdown-body');
        if (post) document.getElementById('latest-post').appendChild(post);
      });
  </script>
</body>
</html>
