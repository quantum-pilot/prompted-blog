<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prompted Blog</title>
  <link rel="stylesheet" href="assets/github-markdown.css">
  <link rel="stylesheet" href="assets/font-awesome-6.4.0.css">
  <link rel="stylesheet" href="assets/diff2html.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      position: relative;
      overflow-x: hidden;
    }
    .header {
      border-bottom: 1px solid #e1e4e8;
      margin: 0 auto 2rem;
      max-width: 800px;
      padding: 0 1rem;
      position: relative;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0;
    }
    .description {
      color: #586069;
      font-size: 1.1rem;
      margin: 0.5rem 0 1.5rem;
    }
    .history-button {
      position: absolute;
      right: 0.5rem;
      top: 1rem;
      background: none;
      border: none;
      font-size: 1.4rem;
      color: #57606a;
      cursor: pointer;
    }
    .history-button.active {
      color: #0969da;
    }
    .history-button:hover {
      color: #24292f;
    }
    .nav-button {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: #f6f8fa;
      border: 1px solid #d1d5da;
      padding: 0.3rem 0.6rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .prev-post {
      left: 0.5rem;
    }
    .next-post {
      right: 0.5rem;
    }
    #diff-output {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 3rem;
      width: 90vw;
      margin-inline: auto;
      box-sizing: border-box;
    }
    .diff-container {
      flex: 1;
      overflow-y: auto;
      max-height: 90vh;
      min-width: 0;
    }
    #revision-scroller {
      position: fixed;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .rev-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
      cursor: pointer;
    }
    .rev-dot.active {
      background: #333;
    }
    .rev-scroll-icon {
      width: 24px;
      height: 24px;
      background: url('assets/scroll-icon.svg') center center no-repeat;
      background-size: contain;
    }
  </style>
</head>
<body>
  <button class="nav-button prev-post">← Prev</button>
  <button class="nav-button next-post">Next →</button>
  <header class="header">
    <h1>Prompted Blog</h1>
    <p class="description">Prompt-driven commit history as a blog. One prompt at a time.</p>
    <button class="history-button" id="history-trigger" title="Toggle Prompt History">
      <i class="fas fa-history"></i>
    </button>
  </header>
  <main id="latest-post" class="markdown-body" style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
    <!-- Latest post will be injected here -->
  </main>
  <div id="diff-output"></div>
  <div id="revision-scroller"></div>

  <script src="assets/diff2html.min.js"></script>
  <script>
    const url = new URL(window.location);
    const isHistory = url.searchParams.get('history_enabled') === 'true';
    const diffOutput = document.getElementById('diff-output');
    const historyBtn = document.getElementById('history-trigger');
    const revScroller = document.getElementById('revision-scroller');

    if (isHistory) historyBtn.classList.add('active');

    fetch('latest.json')
      .then(res => res.json())
      .then(path => {
        if (isHistory) {
          document.getElementById('latest-post').style.display = 'none';

          const targets = [
            { path: 'instructions.txt', dir: '.' },
            { path: 'prompts.txt', dir: path },
            { path: 'output.md', dir: path }
          ];

          const order = targets.map(t => t.path);
          const blockMap = new Map(order.map(k => [k, null]));

          const revisionsCount = [];

          let maxRevs = 0;

          Promise.all(targets.map(({ path: fname, dir }) =>
            fetch(`${dir}/diff_cache/${fname}/revisions.json`)
              .then(res => res.json())
              .then(revisions => {
                revisionsCount.push(revisions.length);
                maxRevs = Math.max(maxRevs, revisions.length);
                return { fname, dir, revisions };
              })
          )).then(files => {
            renderRevision(maxRevs - 1);

            const dots = [];
            for (let i = 0; i < maxRevs; i++) {
              const dot = document.createElement('div');
              dot.className = 'rev-dot';
              if (i === maxRevs - 1) dot.classList.add('active');
              dot.addEventListener('click', () => {
                dots.forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                renderRevision(i);
              });
              dots.push(dot);
              revScroller.appendChild(dot);
            }

            const scrollIcon = document.createElement('div');
            scrollIcon.className = 'rev-scroll-icon';
            revScroller.appendChild(scrollIcon);

            function renderRevision(index) {
              diffOutput.innerHTML = '';
              files.forEach(({ fname, dir, revisions }) => {
                if (index <= 0 || index >= revisions.length) return;
                const file = `${dir}/diff_cache/${fname}/${index}.diff`;
                fetch(file)
                  .then(r => r.ok ? r.text() : Promise.reject())
                  .then(raw => {
                    const html = Diff2Html.html(raw, {
                      drawFileList: false,
                      matching: 'lines',
                      outputFormat: 'side-by-side'
                    });
                    const container = document.createElement('div');
                    container.className = 'diff-container';
                    container.innerHTML = html;
                    blockMap.set(fname, container);
                  })
                  .catch(() => {
                    const fallback = document.createElement('div');
                    fallback.className = 'diff-container';
                    fallback.innerHTML = `<div style='padding:1rem; font-style:italic;'>No diff for <code>${fname}</code> at rev ${index}.</div>`;
                    blockMap.set(fname, fallback);
                  })
                  .finally(() => {
                    order.forEach(k => {
                      const el = blockMap.get(k);
                      if (el && !diffOutput.contains(el)) diffOutput.appendChild(el);
                    });
                  });
              });
            }
          });
        } else {
          fetch(`${path}/index.html`)
            .then(res => res.text())
            .then(html => {
              const temp = document.createElement('div');
              temp.innerHTML = html;
              const post = temp.querySelector('.markdown-body');
              if (post) document.getElementById('latest-post').appendChild(post);
            });
        }
      });

    historyBtn.addEventListener('click', () => {
      const active = historyBtn.classList.contains('active');
      if (active) {
        url.searchParams.delete('history_enabled');
      } else {
        url.searchParams.set('history_enabled', 'true');
      }
      window.location = url.toString();
    });
  </script>
</body>
</html>
