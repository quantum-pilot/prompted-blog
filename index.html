<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prompted Blog</title>
  <link rel="stylesheet" href="assets/github-markdown.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 2rem auto;
      max-width: 800px;
      padding: 0 1rem;
    }
    .header {
      border-bottom: 1px solid #e1e4e8;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0;
    }
    .description {
      color: #586069;
      font-size: 1.1rem;
      margin: 0.5rem 0 1.5rem;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Prompted Blog</h1>
    <p class="description">Prompt-driven commit history as a blog. One prompt at a time.</p>
  </header>
  <main id="latest-post" class="markdown-body">
    <!-- Latest post will be injected here -->
  </main>
  <script>
    fetch('posts/2025-07-27/index.html')
      .then(res => res.text())
      .then(html => {
        const temp = document.createElement('div');
        temp.innerHTML = html;
        const post = temp.querySelector('.markdown-body');
        if (post) document.getElementById('latest-post').appendChild(post);
      });
  </script>
</body>
</html>
