<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prompted Blog</title>
  <link rel="stylesheet" href="assets/github-markdown.css">
  <link rel="stylesheet" href="assets/font-awesome-6.4.0.css">
  <link rel="stylesheet" href="assets/diff2html.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      position: relative;
      overflow-x: hidden;
    }
    .header {
      border-bottom: 1px solid #e1e4e8;
      margin: 0 auto 2rem;
      max-width: 800px;
      padding: 0 1rem;
      position: relative;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0;
    }
    .description {
      color: #586069;
      font-size: 1.1rem;
      margin: 0.5rem 0 1.5rem;
    }
    .history-button {
      position: absolute;
      right: 0.5rem;
      top: 1rem;
      background: none;
      border: none;
      font-size: 1.4rem;
      color: #57606a;
      cursor: pointer;
    }
    .history-button.active {
      color: #0969da;
    }
    .history-button:hover {
      color: #24292f;
    }
    .nav-button {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: #f6f8fa;
      border: 1px solid #d1d5da;
      padding: 0.3rem 0.6rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .prev-post {
      left: 0.5rem;
    }
    .next-post {
      right: 0.5rem;
    }
    #diff-output {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 3rem;
      width: 90vw;
      margin-inline: auto;
      box-sizing: border-box;
    }
    .diff-container {
      flex: 1;
      max-height: 75vh;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .instructions-container {
      position: fixed !important;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50vw;
      height: 50vh;
      background: white;
      border: 2px solid #d1d5da;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      z-index: 1000;
      flex: none !important;
    }
    .diff-header {
      background: #f6f8fa;
      border-bottom: 1px solid #d1d5da;
      padding: 0.5rem 1rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .instructions-btn {
      background: #0969da;
      color: white;
      border: none;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .instructions-btn:hover {
      background: #0550ae;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #656d76;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .close-btn:hover {
      color: #24292f;
    }
    .diff-full {
      white-space: pre-wrap;
      padding: 1rem;
      background: #f6f8fa;
      border-top: 1px solid #d1d5da;
      font-family: monospace;
      font-size: 0.9rem;
      overflow-y: auto;
      flex: 1;
    }
    #revision-scroller {
      position: fixed;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .rev-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
      cursor: pointer;
    }
    .rev-dot.active {
      background: #333;
    }
    .rev-scroll-icon {
      width: 24px;
      height: 24px;
      background: url('assets/scroll-icon.svg') center center no-repeat;
      background-size: contain;
    }
  </style>
</head>
<body>
  <button class="nav-button prev-post">← Prev</button>
  <button class="nav-button next-post">Next →</button>
  <header class="header">
    <h1>Prompted Blog</h1>
    <p class="description">Prompt-driven commit history as a blog. One prompt at a time.</p>
    <button class="history-button" id="history-trigger" title="Toggle Prompt History">
      <i class="fas fa-history"></i>
    </button>
  </header>
  <main id="latest-post" class="markdown-body" style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;"></main>
  <div id="diff-output"></div>
  <div id="revision-scroller"></div>
  <script src="assets/diff2html.min.js"></script>
  <script src="assets/diff2html.min.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
