<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prompted Blog</title>
  <link rel="stylesheet" href="assets/github-markdown.css">
  <link rel="stylesheet" href="assets/font-awesome-6.4.0.css">
  <link rel="stylesheet" href="assets/diff2html.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      position: relative;
    }
    .header {
      border-bottom: 1px solid #e1e4e8;
      margin-bottom: 2rem;
      position: relative;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0;
    }
    .description {
      color: #586069;
      font-size: 1.1rem;
      margin: 0.5rem 0 1.5rem;
    }
    .history-button {
      position: absolute;
      right: -3rem;
      top: 1rem;
      background: none;
      border: none;
      font-size: 1.4rem;
      color: #57606a;
      cursor: pointer;
    }
    .history-button.active {
      color: #0969da;
    }
    .history-button:hover {
      color: #24292f;
    }
    .nav-button {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: #f6f8fa;
      border: 1px solid #d1d5da;
      padding: 0.3rem 0.6rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .prev-post {
      left: 0.5rem;
    }
    .next-post {
      right: 0.5rem;
    }
    #diff-output {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 3rem;
      width: 90vw;
      margin-inline: auto;
      box-sizing: border-box;
    }
    .diff-container {
      flex: 1;
      overflow-y: auto;
      max-height: 90vh;
      min-width: 0;
    }
  </style>
</head>
<body>
  <button class="nav-button prev-post">← Prev</button>
  <button class="nav-button next-post">Next →</button>
  <header class="header">
    <h1>Prompted Blog</h1>
    <p class="description">Prompt-driven commit history as a blog. One prompt at a time.</p>
    <button class="history-button" id="history-trigger" title="Toggle Prompt History">
      <i class="fas fa-history"></i>
    </button>
  </header>
  <main id="latest-post" class="markdown-body">
    <!-- Latest post will be injected here -->
  </main>
  <div id="diff-output"></div>

  <script src="assets/diff2html.min.js"></script>
  <script>
    const url = new URL(window.location);
    const isHistory = url.searchParams.get('history_enabled') === 'true';
    const diffOutput = document.getElementById('diff-output');
    const historyBtn = document.getElementById('history-trigger');

    if (isHistory) historyBtn.classList.add('active');

    fetch('latest.json')
      .then(res => res.json())
      .then(path => {
        if (isHistory) {
          document.getElementById('latest-post').style.display = 'none';

          const targets = [
            { path: 'instructions.txt', dir: '.' },
            { path: 'prompts.txt', dir: path },
            { path: 'output.md', dir: path }
          ];

          targets.forEach(({ path: fname, dir }) => {
            fetch(`${dir}/diff_cache/${fname}/revisions.json`)
              .then(res => res.json())
              .then(revisions => {
                let rev = revisions.length - 1;
                const tryLoad = () => {
                  if (rev <= 0) return;
                  const file = `${dir}/diff_cache/${fname}/${rev}.diff`;
                  fetch(file)
                    .then(r => r.ok ? r.text() : Promise.reject())
                    .then(raw => {
                      const container = document.createElement('div');
                      container.className = 'diff-container';
                      container.innerHTML = Diff2Html.html(raw, {
                        drawFileList: false,
                        matching: 'lines',
                        outputFormat: 'side-by-side'
                      });
                      diffOutput.appendChild(container);
                    })
                    .catch(() => {
                      rev--;
                      tryLoad();
                    });
                };
                tryLoad();
              });
          });

        } else {
          fetch(`${path}/index.html`)
            .then(res => res.text())
            .then(html => {
              const temp = document.createElement('div');
              temp.innerHTML = html;
              const post = temp.querySelector('.markdown-body');
              if (post) document.getElementById('latest-post').appendChild(post);
            });
        }
      });

    historyBtn.addEventListener('click', () => {
      const active = historyBtn.classList.contains('active');
      if (active) {
        url.searchParams.delete('history_enabled');
      } else {
        url.searchParams.set('history_enabled', 'true');
      }
      window.location = url.toString();
    });
  </script>
</body>
</html>
